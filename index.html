// ── Utils ──────────────────────────────────────────────────────────────────

function flash(msg, ms=3000) {
  const el = document.getElementById('flash');
  el.textContent = msg; el.style.display = 'block'; el.style.opacity = '1';
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.opacity='0'; setTimeout(()=>el.style.display='none',300); }, ms);
}

function pts(pred, res) {
  if (!pred||!res||res.home_score==null||res.away_score==null) return null;
  const [ph,pa,rh,ra] = [pred.home_score,pred.away_score,res.home_score,res.away_score].map(Number);
  if ([ph,pa,rh,ra].some(isNaN)) return null;
  if (ph===rh && pa===ra) return 5;
  if (Math.sign(ph-pa)===Math.sign(rh-ra)) return 2;
  return 0;
}

function pill(txt, col) { return `<span class="pill" style="background:${col}22;border:1px solid ${col}44;color:${col}">${txt}</span>`; }
function html(s) { document.getElementById('main').innerHTML = s; }
function loading(msg='LOADING') { html(`<div class="loading"><span class="spin"></span>${msg}</div>`); }

function nav(screen) {

  }
}

// ── DB helpers ─────────────────────────────────────────────────────────────

async function getCurrentRound() {
  const {data} = await db.from('fixtures').select('round_number').order('round_number',{ascending:false}).limit(1);
  return data?.[0]?.round_number || 1;
}

async function dbFixtures(round) {
  const {data} = await db.from('fixtures').select('*').eq('round_number',round).order('match_date').order('match_time');
  return data||[];
}

async function dbAllFixtures() {
  const {data} = await db.from('fixtures').select('*').order('round_number').order('match_date');
  return data||[];
}

async function dbResults() {
  const {data} = await db.from('results').select('*');
  const m={}; (data||[]).forEach(r=>m[r.fixture_id]=r); return m;
}

async function dbMyPreds(player, round) {
  // Get all fixture IDs for this round first
  const fixes = await dbFixtures(round);
  const ids = fixes.map(f=>f.id);
  if (!ids.length) return {};
  const {data} = await db.from('predictions').select('*').eq('player_name',player).in('fixture_id',ids);
  const m={}; (data||[]).forEach(p=>m[p.fixture_id]=p); return m;
}

async function dbAllPreds() {
  const {data} = await db.from('predictions').select('*');
  return data||[];
}

async function dbPotCharges() {
  const {data} = await db.from('pot_charges').select('*');
  return data||[];
}

async function dbUpsertPred(player,fid,h,a) {
  const {error} = await db.from('predictions').upsert({player_name:player,fixture_id:fid,home_score:h,away_score:a},{onConflict:'player_name,fixture_id'});
  return !error;
}

async function dbUpsertResult(fid,h,a) {
  const {error} = await db.from('results').upsert({fixture_id:fid,home_score:h,away_score:a},{onConflict:'fixture_id'});
  return !error;
}

async function dbAddFixture(f) {
  const {error} = await db.from('fixtures').insert(f);
  return !error;
}

async function dbDelFixture(id) {
  await Promise.all([
    db.from('fixtures').delete().eq('id',id),
    db.from('results').delete().eq('fixture_id',id),
    db.from('predictions').delete().eq('fixture_id',id),
  ]);
}

// ── Player auth DB functions ──────────────────────────────────────────────────

async function dbRegister(loginId, shortname) {
  // Check shortname not already taken
  const {data:existing} = await db.from('players').select('login_id').eq('shortname', shortname);
  if (existing && existing.length > 0) return {error: 'shortname_taken'};
  // Check login_id not taken
  const {data:idCheck} = await db.from('players').select('login_id').eq('login_id', loginId);
  if (idCheck && idCheck.length > 0) return {error: 'id_taken'};
  const {error} = await db.from('players').insert({login_id: loginId, shortname});
  return error ? {error: 'db_error'} : {success: true};
}

async function dbGetPlayer(loginId) {
  const {data} = await db.from('players').select('*').eq('login_id', loginId).single();
  return data || null;
}

async function dbGetShortnames(loginIds) {
  if (!loginIds.length) return {};
  const {data} = await db.from('players').select('login_id,shortname').in('login_id', loginIds);
  const m = {};
  (data||[]).forEach(p => m[p.login_id] = p.shortname);
  return m;
}

async function dbGetAllPlayers() {
  const {data} = await db.from('players').select('*').order('created_at');
  return data||[];
}

// ── Checkpoints ───────────────────────────────────────────────────────────────

async function saveCheckpoint() {
  const round = S.currentRound;
  const [fixtures, results, allPreds, potCharges] = await Promise.all([
    db.from('fixtures').select('*').then(r => r.data||[]),
    db.from('results').select('*').then(r => r.data||[]),
    db.from('predictions').select('*').then(r => r.data||[]),
    db.from('pot_charges').select('*').then(r => r.data||[]),
  ]);
  const {error} = await db.from('checkpoints').insert({
    round_number: round,
    fixtures_data: fixtures,
    results_data: results,
    predictions_data: allPreds,
    pot_charges_data: potCharges,
  });
  if (error) { flash('Checkpoint failed — check Supabase'); console.error(error); return; }
  flash(`✓ Checkpoint saved after Round ${round}`);
  renderAdmin();
}

async function loadCheckpoints() {
  const {data} = await db.from('checkpoints').select('*').order('created_at', {ascending:false}).limit(5);
  return data||[];
}

async function rollbackToCheckpoint(id, roundNum) {
  if (!confirm(`Roll back to the checkpoint saved after Round ${roundNum}?

This will overwrite ALL current predictions, results and pot charges. This cannot be undone.`)) return;
  
  // Load checkpoint
  const {data:cp} = await db.from('checkpoints').select('*').eq('id', id).single();
  if (!cp) { flash('Checkpoint not found'); return; }

  flash('Rolling back... please wait', 10000);

  // Wipe current data
  await Promise.all([
    db.from('predictions').delete().neq('id', '00000000-0000-0000-0000-000000000000'),
    db.from('results').delete().neq('fixture_id', 'NONE'),
    db.from('fixtures').delete().neq('id', 'NONE'),
    db.from('pot_charges').delete().neq('id', '00000000-0000-0000-0000-000000000000'),
  ]);

  // Restore from checkpoint in batches
  if (cp.fixtures_data?.length)     await db.from('fixtures').insert(cp.fixtures_data);
  if (cp.results_data?.length)      await db.from('results').insert(cp.results_data);
  if (cp.predictions_data?.length)  await db.from('predictions').insert(cp.predictions_data);
  if (cp.pot_charges_data?.length)  await db.from('pot_charges').insert(cp.pot_charges_data);

  flash(`✓ Rolled back to Round ${roundNum} checkpoint`);
  S.currentRound = roundNum;
  renderAdmin();
}

async function doRegister() {
  const shortname = document.getElementById('reg_name')?.value?.trim();
  const pinRaw = document.getElementById('reg_pin')?.value?.trim();
  if (!shortname) { flash('Enter a shortname'); return; }
  if (!pinRaw || pinRaw.length !== 4 || isNaN(pinRaw)) { flash('PIN must be exactly 4 digits'); return; }
  const loginId = shortname.toLowerCase().replace(/[^a-z0-9]/g,'') + pinRaw;
  loading('Creating account...');
  const result = await dbRegister(loginId, shortname);
  if (result.error === 'shortname_taken') { renderRegister(); flash('That name is already taken — try a different one'); return; }
  if (result.error === 'id_taken') { renderRegister(); flash('That name/PIN combination is taken — try a different PIN'); return; }
  if (result.error) { renderRegister(); flash('Something went wrong — try again'); return; }
  // Success - show login ID
  localStorage.setItem('wc26_login', loginId);
  localStorage.setItem('wc26_shortname', shortname);
  S.player = loginId; S.shortname = shortname;
  nav('home');
  html(`
    <div style="padding-top:24px">
      <div style="text-align:center;margin-bottom:20px">
        <div style="font-size:48px;margin-bottom:8px">🎉</div>

    </div>
  `);
}

async function doPlayerLogin() {
  const name = document.getElementById('li_name')?.value?.trim();
  const pin  = document.getElementById('li_pin')?.value?.trim();
  if (!name || !pin) { flash('Enter both name and PIN'); return; }
  if (pin.length !== 4 || isNaN(pin)) { flash('PIN must be 4 digits'); return; }
  const loginId = name.toLowerCase().replace(/[^a-z0-9]/g,'') + pin;
  loading('Logging in...');
  const player = await dbGetPlayer(loginId);
  if (!player) { renderPlayerLogin(); flash("Name or PIN not recognised"); return; }
  localStorage.setItem('wc26_login', loginId);
  localStorage.setItem('wc26_shortname', player.shortname);
  S.player = loginId; S.shortname = player.shortname;
  await doLoadAndPlay();

function renderPredict() {

        </div>
      </div>`);
    return;
  }

  // Build round summary
  const gamesWithResults = fixtures.filter(f => { const r=results[f.id]; return r&&r.home_score!=null&&r.away_score!=null; });
  let summaryHTML = '';
  if (gamesWithResults.length > 0) {
    let roundTotal = 0;
    const summaryRows = fixtures.map(f => {
      const pred = myPreds[f.id]||{};
      const res  = results[f.id];
      const hasRes = res&&res.home_score!=null&&res.away_score!=null;
      const p = hasRes ? pts(pred, res) : null;
      if (p!==null) roundTotal += p;
      const predStr = pred.home_score!=null&&pred.away_score!=null ? `${pred.home_score}–${pred.away_score}` : '—';
      const actStr  = hasRes ? `${res.home_score}–${res.away_score}` : 'Pending';
      const ptStr   = p===5?'🎯 5pts':p===2?'✓ 2pts':p===0?'✗ 0pts':'—';
      const ptCol   = p===5?'#a3e635':p===2?'#22d3ee':p===0?'#f87171':'#3a5a3a';
      return `
        <div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #1a2e1a">
          <div style="flex:1">
            <div style="font-weight:bold;font-size:12px">${f.home} vs ${f.away}</div>
            <div style="font-size:11px;margin-top:2px;color:#3a5a3a">
              Your pick: <span style="color:#b0d0b0">${predStr}</span>
              &nbsp;·&nbsp; Actual: <span style="color:#fff;font-weight:bold">${actStr}</span>
            </div>
          </div>
          <div style="font-weight:bold;font-size:12px;color:${ptCol};white-space:nowrap">${ptStr}</div>
        </div>`;
    }).join('');
    summaryHTML = `
      <div class="card" style="margin-top:4px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <span style="font-size:11px;color:#4a8a2a;letter-spacing:0.2em;text-transform:uppercase">Round Summary</span>
          <span style="font-size:20px;font-weight:bold;color:${roundTotal>0?'#a3e635':'#f87171'}">${roundTotal}<span style="font-size:12px;font-weight:normal;color:#3a5a3a"> pts</span></span>
        </div>
        ${summaryRows}
      </div>`;
  }

  const rows = fixtures.map(f => {
    const pred=myPreds[f.id]||{};
    const res=results[f.id];
    const hasRes=res&&res.home_score!=null&&res.away_score!=null;
    const p=hasRes?pts(pred,res):null;
    const col=p===5?'#a3e635':p===2?'#22d3ee':'#f87171';
    const cardStyle=hasRes&&p===5?'background:linear-gradient(135deg,#0d2a06,#0a1e0a);border-color:#3a6a18':'';
    const resBar=hasRes?`
      <div class="result-bar">
        <span style="color:#4a6a4a">Result: <strong style="color:#fff">${res.home_score}–${res.away_score}</strong></span>
        ${pill(p===5?'🎯 5 pts':p===2?'✓ 2 pts':'✗ 0 pts',col)}
      </div>`:'';
    return `
      <div class="card" style="${cardStyle}">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          ${pill(f.group_name,'#4a8a2a')}
          <span style="font-size:11px;color:#3a5a3a">${f.match_date} · ${f.match_time}</span>
        </div>
        <div class="fixture-row">
          <span class="team r">${f.home}</span>
          <input type="number" min="0" max="20" value="${pred.home_score??''}" ${hasRes?'disabled':''} oninput="upd('${f.id}','h',this.value)" placeholder="—">
          <span class="sep">:</span>
          <input type="number" min="0" max="20" value="${pred.away_score??''}" ${hasRes?'disabled':''} oninput="upd('${f.id}','a',this.value)" placeholder="—">
          <span class="team">${f.away}</span>
        </div>
        ${resBar}
      </div>`;
  }).join('');

  html(`
    <div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
        <span style="font-weight:bold;font-size:18px">Your Picks</span>${pill(S.shortname,'#a3e635')}
      </div>
      <div class="round-badge">Round ${currentRound}</div>
      ${rows}
      ${summaryHTML}
      <button class="btn btn-g" onclick="savePreds()" style="margin-top:8px">Save Predictions</button>
      <p style="text-align:center;font-size:11px;color:#2a4a2a;margin-top:8px">🎯 Exact score = 5pts · ✓ Correct result = 2pts · Submit &amp; score zero = £2 penalty</p>
    </div>
  `);
}

function upd(fid,side,val) {
  if (!pending[fid]) pending[fid]={...(S.myPreds[fid]||{})};
  pending[fid][side==='h'?'home_score':'away_score']=val===''?null:parseInt(val);
}

async function savePreds() {
  let saved=0;
  const toSave={...S.myPreds};
  for (const [fid,p] of Object.entries(pending)) toSave[fid]={...(toSave[fid]||{}),...p};
  for (const f of S.fixtures) {
    const res=S.results[f.id];
    if (res&&res.home_score!=null&&res.away_score!=null) continue;
    const p=toSave[f.id]||{};
    if (p.home_score!=null&&p.away_score!=null) {
      const ok=await dbUpsertPred(S.player,f.id,p.home_score,p.away_score);
      if (ok) { S.myPreds[f.id]=p; saved++; }
    }
  }
  pending={};
  flash(`${saved} prediction${saved!==1?'s':''} saved ✓`);
}

async function doBoard() {
  nav('board');
  loading('LOADING BOARD');

  const [allFixtures, allResults, allPreds, potCharges] = await Promise.all([
    dbAllFixtures(),
    dbResults(),
    dbAllPreds(),
    dbPotCharges(),
  ]);

  // Maps
  const fixturesByRound={};
  allFixtures.forEach(f=>{
    if (!fixturesByRound[f.round_number]) fixturesByRound[f.round_number]=[];
    fixturesByRound[f.round_number].push(f);
  });

  const predsByPlayer={};
  allPreds.forEach(p=>{
    if (!predsByPlayer[p.player_name]) predsByPlayer[p.player_name]=[];
    predsByPlayer[p.player_name].push(p);
  });

  const allLoginIds=[...new Set(allPreds.map(p=>p.player_name))];
  const shortnames = await dbGetShortnames(allLoginIds);
  const rounds=Object.keys(fixturesByRound).map(Number).sort();

  // Calculate stats per player
  const playerStats=allLoginIds.map(loginId=>{
    const name = shortnames[loginId] || loginId;
    const preds=predsByPlayer[loginId]||[];
    const predMap={};
    preds.forEach(p=>predMap[p.fixture_id]=p);

    let totalPoints=0, bestRound=0, bestRoundNum=null, exact=0, correct=0;
    rounds.forEach(rn=>{
      const fixes=fixturesByRound[rn]||[];
      let roundTotal=0;
      fixes.forEach(f=>{
        const p=pts(predMap[f.id],allResults[f.id]);
        if (p!==null){totalPoints+=p;roundTotal+=p;if(p===5)exact++;else if(p===2)correct++;}
      });
      if(roundTotal>bestRound){bestRound=roundTotal;bestRoundNum=rn;}
    });

    const charges=potCharges.filter(c=>c.player_name===loginId).length;
    return {name,totalPoints,bestRound,bestRoundNum,exact,correct,charges};
  }).sort((a,b)=>b.totalPoints-a.totalPoints);

  // Pot calcs
  const potTotal=potCharges.length*2;
  const potLeader=playerStats.length?[...playerStats].sort((a,b)=>b.bestRound-a.bestRound)[0]:null;

  // Render pot banner
  const potBanner=`
    <div class="pot-banner">
      <div>
        <div class="pot-lbl">💰 £2 Fine Pot</div>
        <div class="pot-val">£${potTotal}</div>
      </div>
      <div class="pot-div"></div>
      <div>
        <div class="pot-lbl">🏆 Fine Pot Leader</div>
        <div style="font-size:15px;font-weight:bold;color:#fcd34d">${potLeader&&potLeader.bestRound>0?potLeader.name:'—'}</div>
        <div style="font-size:11px;color:#78600a;margin-top:2px">${potLeader&&potLeader.bestRound>0?`${potLeader.bestRound}pts in Round ${potLeader.bestRoundNum}`:potCharges.length>0?'No scores yet':'No games scored yet'}</div>
      </div>
    </div>`;

  if (!playerStats.length) {
    html(`<h2 style="text-align:center;margin-bottom:16px;font-size:22px">🏆 Leaderboard</h2>${potBanner}<div style="text-align:center;padding:32px;color:#2a4a2a">No players yet</div>`);
    return;
  }

  const medals=['🥇','🥈','🥉'];
  const rows=playerStats.map((p,i)=>{
    const sub=[
      p.exact>0?`<span style="color:#a3e635">🎯 ${p.exact} exact</span>`:'',
      p.correct>0?`<span style="color:#22d3ee">✓ ${p.correct} correct</span>`:'',
    ].filter(Boolean).join(' &nbsp;');
    const chargeTag=p.charges>0?`<span class="charge-tag">💸 £${p.charges*2} in pot</span>`:'';
    const bestInfo=p.bestRoundNum?`<div style="font-size:10px;color:#4a6a4a;margin-top:2px">Best: ${p.bestRound}pts (Rd ${p.bestRoundNum})</div>`:'';
    const isPotLeader=potLeader&&p.name===potLeader.name&&p.bestRound>0;
    return `
      <div class="card ${isPotLeader?'gold':i===0&&p.totalPoints>0?'hl':''}">
        <div class="board-row">
          <div class="board-med">${medals[i]||(i+1)}</div>
          <div style="flex:1">
            <div style="font-weight:bold;font-size:16px">${p.name}${isPotLeader?' 🏆':''}</div>
            <div style="font-size:11px;margin-top:2px;color:#3a6a3a">${sub||'No scored games yet'} ${chargeTag}</div>
            ${bestInfo}
          </div>
          <div style="font-size:26px;font-weight:bold;color:${p.totalPoints>0?'#a3e635':'#2a4a2a'}">
            ${p.totalPoints}<span style="font-size:13px;font-weight:normal;color:#3a5a3a"> pts</span>
          </div>
        </div>
      </div>`;
  }).join('');

  html(`
    <h2 style="text-align:center;margin-bottom:16px;font-size:22px">🏆 Leaderboard</h2>
    ${potBanner}
    ${rows}
    <button class="btn btn-gh" onclick="doBoard()" style="margin-top:4px">↻ Refresh</button>
  `);
}

async function addFixture() {
  const h=document.getElementById('fh')?.value?.trim();
  const a=document.getElementById('fa')?.value?.trim();
  const d=document.getElementById('fd')?.value?.trim();
  const t=document.getElementById('ft')?.value?.trim();
  const g=document.getElementById('fg')?.value?.trim();
  if (!h||!a) { flash('Need both team names'); return; }
  const ok=await dbAddFixture({id:`${Date.now()}`,home:h,away:a,match_date:d||'TBC',match_time:t||'TBC',group_name:g||'Group',round_number:S.currentRound});
  if (ok) { flash('Fixture added ✓'); renderAdmin(); }
  else flash('Error — check Supabase');
}

async function saveResults() {
  let saved=0;
  for (const f of S.fixtures) {
    const h=document.getElementById(`rh_${f.id}`)?.value;
    const a=document.getElementById(`ra_${f.id}`)?.value;
    if (h!==''&&a!==''&&h!=null&&a!=null) { const ok=await dbUpsertResult(f.id,parseInt(h),parseInt(a)); if(ok)saved++; }
  }
  flash(`${saved} result${saved!==1?'s':''} saved ✓`);
}

async function closeRound(roundNum) {
  // Check all results are in
  const allIn = S.fixtures.every(f=>{
    const r=S.results[f.id];
    return r&&r.home_score!=null&&r.away_score!=null;
  });
  if (!allIn) { flash('Enter & save all results first'); return; }

  // Load predictions for this round's fixtures
  const ids=S.fixtures.map(f=>f.id);
  if (!ids.length) { flash('No fixtures in this round'); return; }
  const {data:roundPreds} = await db.from('predictions').select('*').in('fixture_id',ids);

  // Group by player
  const byPlayer={};
  (roundPreds||[]).forEach(p=>{
    if (!byPlayer[p.player_name]) byPlayer[p.player_name]=[];
    byPlayer[p.player_name].push(p);
  });

  // Calculate totals — charge zero-scorers who submitted
  const charged=[];
  for (const [player,preds] of Object.entries(byPlayer)) {
    let total=0;
    preds.forEach(pred=>{
      const p=pts(pred,S.results[pred.fixture_id]);
      if (p!==null) total+=p;
    });
    if (total===0) {
      await db.from('pot_charges').upsert({player_name:player,round_number:roundNum},{onConflict:'player_name,round_number'});
      charged.push(player);
    }
  }

  if (charged.length===0) flash(`Round ${roundNum} closed — no zero scores, pot unchanged 👏`);
  else flash(`Round ${roundNum} closed — ${charged.join(', ')} owe £2 each 💸`, 4000);
  renderAdmin();
}

async function startNewRound(currentRound) {
  if (!confirm(`Start Round ${currentRound+1}? Make sure Round ${currentRound} is fully closed first.`)) return;
  S.currentRound = currentRound + 1;
  localStorage.setItem('wc26_admin_round', S.currentRound);
  flash(`Round ${currentRound+1} started — add fixtures below`);
  renderAdmin(S.currentRound);
}

async function delFixture(id) {
  if (!confirm('Delete fixture and all its predictions?')) return;
  await dbDelFixture(id);
  flash('Fixture removed');
  renderAdmin();
}

async function renamePlayer() {
  const oldName = document.getElementById('rp_old')?.value?.trim();
  const newName = document.getElementById('rp_new')?.value?.trim();
  if (!oldName || !newName) { flash('Enter both names'); return; }
  if (oldName === newName) { flash('Names are the same!'); return; }
  if (!confirm(`Rename "${oldName}" to "${newName}"? This updates all their data.`)) return;

  // Update shortname in players table
  const {error: e0} = await db.from('players').update({shortname: newName}).eq('shortname', oldName);
  // Update predictions (login_id stays same, shortname changes in players table)
  const {error: e1} = await db.from('predictions').update({player_name: newName}).eq('player_name', oldName);
  // Update pot charges
  const {error: e2} = await db.from('pot_charges').update({player_name: newName}).eq('player_name', oldName);

  if (e1 || e2) { flash('Error — check Supabase'); console.error(e1, e2); return; }
  // Update localStorage shortname if it's the current user
  if (localStorage.getItem('wc26_shortname') === oldName) {
    localStorage.setItem('wc26_shortname', newName);
  }
  flash(`Renamed "${oldName}" → "${newName}" ✓`);
  document.getElementById('rp_old').value = '';
  document.getElementById('rp_new').value = '';
  renderAdmin();
}

// ── Boot ───────────────────────────────────────────────────────────────────
renderHome();
</script>
</body>
</html>
